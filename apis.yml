name: SpringSource
description: 'SpringSource was the software company behind the open-source Spring Framework for
  Java. Founded in 2004 as Interface21 by Rod Johnson and colleagues, it was venture-backed
  (Accel, Benchmark) and acquired by VMware in 2009. The Spring portfolio subsequently moved
  through Pivotal and VMware Tanzu and is maintained today by Broadcom. The springsource.com
  domain now 301-redirects to spring.io, the current home of the Spring ecosystem. SpringSource
  exposed no standalone public API of its own; this profile documents the historical company
  and its lineage into today''s Spring projects.'
